<!DOCTYPE html>
<html lang="en">
    <style>

#social-media {
  background: #000000;
}

.m-heading {
  font-weight: 700;
  margin-top: 6px;
  color: #ffffff;
}

.media_link {
  border: 2px solid #f2a900;
  border-radius: 4px;
  padding: 14px 18px;
  margin-right: 18px;
  text-align: left;
}

.row.pt-5 {
  gap: 18px;
}

.media_link h3 {
  font-size: 16px;
  font-weight: 600;
  margin: 0;
}

.media_link i {
  font-size: 22px;
}


.media_link.bg-warning {
  border: 2px solid #f2a900;
}

.media_link.bg-warning h3,
.media_link.bg-warning i {
  color: #212529; 
}


footer {
  background: #2b2b2b;
  width: 100%;
}

footer .container {
  padding: 22px 0 !important;
}

footer h5 {
  margin: 0;
  font-size: 14px;
  font-weight: 500;
  color: #8b8b8b;
}

footer a {
  color: #f2a900 !important;
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}
    </style>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  

  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" 
  />
  

  <link rel="stylesheet" href="style.css" />
  

  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" 
  />
  

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link 
    href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;600;700&family=Barlow:wght@400;600;700&family=Roboto+Slab:wght@400;700&display=swap" 
    rel="stylesheet" 
  />
  
  <title>Portfolio</title>
</head>
<body>


  <div id="social-media" class="container-fluid">
    <div class="container text-white py-5">
      <h4 class="text-warning">Social Media</h4>
      <h1 class="m-heading text-white">Let's be friends</h1>
      
      <div class="row pt-5">

        <div class="col-3 media_link bg-warning btn">
          <div class="row align-items-center">
            <div class="col-8 text-dark">
              <h3>LinkedIn</h3>
            </div>
            <div class="col-4 text-right text-dark">
              <i class="fa fa-linkedin"></i>
            </div>
          </div>
        </div>

       
        <div class="col-3 media_link bg-warning btn">
          <div class="row align-items-center">
            <div class="col-8 text-dark">
              <h3>Youtube</h3>
            </div>
            <div class="col-4 text-right text-dark">
              <i class="fa fa-youtube-play"></i>
            </div>
          </div>
        </div>

        <div class="col-3 media_link bg-warning btn">
          <div class="row align-items-center">
            <div class="col-8 text-dark">
              <h3>Email</h3>
            </div>
            <div class="col-4 text-right text-dark">
              <i class="fa fa-envelope"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <footer>
    <div class="container text-muted text-center py-3 mt-5">
      <h5>
        Copyright © 2021 | 
        <a href="#about" class="text-warning text-decoration-none">
          All Rights Are Reserved By Codingal Education
        </a>
      </h5>
    </div>
  </footer>

</body>
</html>
